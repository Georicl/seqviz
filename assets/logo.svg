<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="helix1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="50%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#f0883e"/>
    </linearGradient>
    <linearGradient id="helix2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0883e"/>
      <stop offset="50%" style="stop-color:#ff7b72"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  
  <!-- Terminal prompt line -->
  <text x="42" y="82" font-family="SF Mono, Menlo, monospace" font-size="22" fill="#484f58" opacity="0.6">$</text>
  <text x="62" y="82" font-family="SF Mono, Menlo, monospace" font-size="22" fill="#7ee787" opacity="0.6">seqviz</text>
  
  <!-- DNA Double Helix - Left strand -->
  <path d="M 120,110 C 120,140 200,140 200,170 C 200,200 120,200 120,230 C 120,260 200,260 200,290" 
        stroke="url(#helix1)" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- DNA Double Helix - Right strand -->
  <path d="M 200,110 C 200,140 120,140 120,170 C 120,200 200,200 200,230 C 200,260 120,260 120,290" 
        stroke="url(#helix2)" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Base pair connections -->
  <line x1="145" y1="125" x2="175" y2="125" stroke="#3fb950" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="135" y1="145" x2="185" y2="145" stroke="#ff7b72" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="135" y1="155" x2="185" y2="155" stroke="#58a6ff" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  
  <line x1="185" y1="185" x2="135" y2="185" stroke="#f0883e" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="185" y1="195" x2="135" y2="195" stroke="#3fb950" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="175" y1="215" x2="145" y2="215" stroke="#ff7b72" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  
  <line x1="135" y1="245" x2="185" y2="245" stroke="#58a6ff" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="135" y1="255" x2="185" y2="255" stroke="#f0883e" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="145" y1="275" x2="175" y2="275" stroke="#3fb950" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Colored sequence blocks (right side) -->
  <g transform="translate(230, 120)">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#3fb950" opacity="0.9"/>
    <text x="9" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">A</text>
    
    <rect x="22" y="0" width="18" height="18" rx="3" fill="#ff7b72" opacity="0.9"/>
    <text x="31" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">T</text>
    
    <rect x="44" y="0" width="18" height="18" rx="3" fill="#58a6ff" opacity="0.9"/>
    <text x="53" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">C</text>
    
    <rect x="66" y="0" width="18" height="18" rx="3" fill="#f0883e" opacity="0.9"/>
    <text x="75" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">G</text>
  </g>
  
  <g transform="translate(230, 148)">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#ff7b72" opacity="0.9"/>
    <text x="9" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">T</text>
    
    <rect x="22" y="0" width="18" height="18" rx="3" fill="#3fb950" opacity="0.9"/>
    <text x="31" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">A</text>
    
    <rect x="44" y="0" width="18" height="18" rx="3" fill="#f0883e" opacity="0.9"/>
    <text x="53" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">G</text>
    
    <rect x="66" y="0" width="18" height="18" rx="3" fill="#58a6ff" opacity="0.9"/>
    <text x="75" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">C</text>
  </g>
  
  <g transform="translate(230, 176)">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#58a6ff" opacity="0.9"/>
    <text x="9" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">C</text>
    
    <rect x="22" y="0" width="18" height="18" rx="3" fill="#f0883e" opacity="0.9"/>
    <text x="31" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">G</text>
    
    <rect x="44" y="0" width="18" height="18" rx="3" fill="#3fb950" opacity="0.9"/>
    <text x="53" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">A</text>
    
    <rect x="66" y="0" width="18" height="18" rx="3" fill="#ff7b72" opacity="0.9"/>
    <text x="75" y="13" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="bold">T</text>
  </g>
  
  <!-- Quality bar visualization -->
  <g transform="translate(230, 210)">
    <rect x="0" y="0" width="12" height="8" rx="2" fill="#3fb950" opacity="0.8"/>
    <rect x="14" y="0" width="12" height="8" rx="2" fill="#3fb950" opacity="0.8"/>
    <rect x="28" y="0" width="12" height="8" rx="2" fill="#3fb950" opacity="0.8"/>
    <rect x="42" y="0" width="12" height="8" rx="2" fill="#f0883e" opacity="0.8"/>
    <rect x="56" y="0" width="12" height="8" rx="2" fill="#f0883e" opacity="0.8"/>
    <rect x="70" y="0" width="12" height="8" rx="2" fill="#ff7b72" opacity="0.8"/>
  </g>
  
  <!-- App name -->
  <text x="200" y="340" font-family="SF Mono, Menlo, Consolas, monospace" font-size="52" fill="#e6edf3" text-anchor="middle" font-weight="bold" letter-spacing="4">seqviz</text>
  
  <!-- Tagline -->
  <text x="200" y="368" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle" letter-spacing="2">TERMINAL SEQUENCE VIEWER</text>
</svg>

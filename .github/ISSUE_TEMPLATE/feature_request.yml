name: "✨ 功能请求"
description: "提出一个新功能或改进建议"
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请填写以下信息，帮助我们评估和规划新功能。

  - type: textarea
    id: problem
    attributes:
      label: "你的功能请求是否与某个问题相关？"
      description: "描述你目前遇到的不便或痛点。例如：我总是需要手动……"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "期望的解决方案"
      description: "描述你希望如何实现这个功能"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案"
      description: "你考虑过的替代方案或折中思路（可选）"

  - type: dropdown
    id: scope
    attributes:
      label: "功能范围"
      description: "该功能主要涉及哪个方面？"
      options:
        - "CLI 命令行工具"
        - "TUI 交互式浏览器"
        - "序列解析 / 统计"
        - "主题 / 渲染"
        - "配置系统"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "补充信息"
      description: "任何有助于理解需求的背景信息、截图或参考链接"

name: "🐛 Bug 报告"
description: "报告一个 Bug，帮助我们改进 seqviz"
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈！请填写以下信息，帮助我们复现和修复问题。

  - type: textarea
    id: description
    attributes:
      label: "问题描述"
      description: "清晰、简洁地描述你遇到的问题"
      placeholder: "例如：使用 `seqviz view` 查看 FASTA 文件时，序列颜色显示异常..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "复现步骤"
      description: "提供复现该问题的具体步骤"
      placeholder: |
        1. 运行命令 `seqviz view test.fa`
        2. 输入快捷键 `g`
        3. 看到错误...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期望行为"
      description: "描述你期望发生的正确行为"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "实际行为"
      description: "描述实际发生的行为（包括错误信息、截图等）"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "运行环境"
      description: "请填写你的运行环境信息"
      value: |
        - **seqviz 版本**：（运行 `seqviz --version` 或 `pip show seqviz` 查看）
        - **Python 版本**：（运行 `python --version` 查看）
        - **操作系统**：（例如 macOS 15.0 / Ubuntu 22.04 / Windows 11）
        - **终端**：（例如 iTerm2 / GNOME Terminal / Windows Terminal）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "错误日志 / 截图"
      description: "粘贴完整的错误日志，或上传截图帮助说明问题"
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: "补充信息"
      description: "其他有助于定位问题的上下文信息（如相关配置文件内容等）"

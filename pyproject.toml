[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seqviz"]

[project]
name = "seqviz"
version = "0.3.0"
description = "A terminal visualizer for biological sequence data — FASTA / FASTQ / VCF"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.scripts]
seqviz = "seqviz.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

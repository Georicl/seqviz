[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasta_fmt"]

[project]
name = "fasta-fmt"
version = "0.1.0"
description = "A terminal beautifier for biological sequences — the bat of FASTA/FASTQ files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.scripts]
fasta-fmt = "fasta_fmt.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
